pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx}"
      run: node_modules/.bin/eslint --fix --no-warn-ignored {staged_files} && node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true

    - name: format
      glob: "*.{js,jsx,mjs,cjs,json,css,md,html,yml,yaml}"
      run: node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true

    - name: typecheck
      run: node_modules/.bin/tsc --noEmit

    - name: test
      # С покрытием: пороги jest.config.js проверяются только при --coverage.
      run: node_modules/.bin/jest --no-watchman --runInBand --coverage
